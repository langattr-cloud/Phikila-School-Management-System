<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="phikila-badge-title phikila-badge-desc">
<title id="phikila-badge-title">Phikila School Management System</title>
<desc id="phikila-badge-desc">Circular gold Phikila emblem: a graduation cap with tassel above a serif letter P, an open book, four sparkles and the Phikila wordmark inside a double gold ring.</desc>
<defs>
<linearGradient id="pk-gold" x1="0.08" y1="0" x2="0.92" y2="1">
<stop offset="0" stop-color="#e7cd88"/>
<stop offset="0.28" stop-color="#c9982e"/>
<stop offset="0.55" stop-color="#b0801f"/>
<stop offset="0.78" stop-color="#d7ab48"/>
<stop offset="1" stop-color="#eed79a"/>
</linearGradient>
<linearGradient id="pk-gold-soft" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f0dca6"/>
<stop offset="0.45" stop-color="#cfa03a"/>
<stop offset="1" stop-color="#a97a1c"/>
</linearGradient>
<linearGradient id="pk-gold-cap" x1="0.15" y1="0" x2="0.85" y2="1">
<stop offset="0" stop-color="#f2e0af"/>
<stop offset="0.35" stop-color="#cfa235"/>
<stop offset="0.7" stop-color="#b2821f"/>
<stop offset="1" stop-color="#e3c273"/>
</linearGradient>
<linearGradient id="pk-ink" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#20232a"/>
<stop offset="1" stop-color="#0e1014"/>
</linearGradient>
</defs>

<!-- Badge field: a white disc keeps the emblem legible on light and dark surfaces alike. -->
<circle cx="256" cy="256" r="250" fill="#ffffff"/>

<!-- Double gold ring -->
<circle cx="256" cy="256" r="233" fill="none" stroke="url(#pk-gold)" stroke-width="11"/>
<circle cx="256" cy="256" r="214" fill="none" stroke="url(#pk-gold)" stroke-width="3.5"/>

<!-- Four-point sparkles -->
<g fill="url(#pk-gold-soft)">
<path d="M256 32 Q259 53 280 56 Q259 59 256 80 Q253 59 232 56 Q253 53 256 32 Z"/>
<path d="M70 224 Q73 245 94 248 Q73 251 70 272 Q67 251 46 248 Q67 245 70 224 Z"/>
<path d="M442 224 Q445 245 466 248 Q445 251 442 272 Q439 251 418 248 Q439 245 442 224 Z"/>
<path d="M256 427 Q259 446 278 449 Q259 452 256 471 Q253 452 234 449 Q253 446 256 427 Z"/>
</g>

<!-- Graduation cap: crown, mortarboard, tassel -->
<path d="M199 122h114v27c0 19-24 28-57 28s-57-9-57-28z" fill="url(#pk-gold-cap)"/>
<path d="M256 78l114 47-114 47-114-47z" fill="url(#pk-gold-cap)"/>
<path d="M256 78l114 47-114 47z" fill="#c19029" opacity="0.35"/>
<path d="M256 168l-100-41v-5l100 41 100-41v5z" fill="#ffffff" opacity="0.85"/>
<path d="M162 122h7v46h-7z" fill="url(#pk-gold-soft)"/>
<circle cx="165.5" cy="174" r="9" fill="url(#pk-gold-soft)"/>
<path d="M157 182h17c3 15 5 28 5 41-8-8-19-8-27 0 0-13 2-26 5-41z" fill="url(#pk-gold-soft)"/>

<!-- Gold letter P sitting behind the black P -->
<path d="M250 136h44c40 0 66 22 66 52 0 32-28 54-70 54h-34v-20h26c28 0 44-14 44-34 0-20-16-32-44-32h-32z" fill="url(#pk-gold)"/>

<!-- Black serif letter P -->
<path d="M196 300h76v-9l-22-3v-56h26c36 0 60-19 60-48 0-30-24-46-62-46h-78v9l18 3v141l-18 3z" fill="url(#pk-ink)"/>

<!-- Open book -->
<path d="M176 272c34-15 58-12 78 4v11c-20-15-44-18-78-4z" fill="url(#pk-gold-soft)"/>
<path d="M336 272c-34-15-58-12-78 4v11c20-15 44-18 78-4z" fill="url(#pk-gold-soft)"/>
<path d="M170 286c36-14 62-10 84 8v18c-22-17-48-20-84-8z" fill="url(#pk-ink)"/>
<path d="M342 286c-36-14-62-10-84 8v18c22-17 48-20 84-8z" fill="url(#pk-ink)"/>
<path d="M256 284l11 15-11 16-11-16z" fill="url(#pk-gold-soft)"/>

<!-- Wordmark -->
<text x="256" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="94" font-weight="400" letter-spacing="1.5" fill="#131316">Phikila</text>

<!-- Divider -->
<path d="M128 408h114M270 408h114" stroke="url(#pk-gold-soft)" stroke-width="2.6" stroke-linecap="round"/>
<path d="M256 398l8 10-8 10-8-10z" fill="url(#pk-gold-soft)"/>
</svg>
