<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print preview - Timetable for each class</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Segoe UI;margin:0}
#asc-print{min-height:100vh;background:#aab3c4}
.ribbon-top{background:#e8eef7;padding:5px 10px;border-bottom:1px solid #999;font-size:12px;font-weight:bold;word-spacing:12px}
.ribbon-2{background:#eef3fa;padding:7px 10px;border-bottom:2px solid #999;font-size:11px;white-space:nowrap;overflow:auto}
.paper{background:#fff;width:820px;margin:18px auto;padding:14px;box-shadow:0 0 12px #000}
.title{text-align:center;font-size:28px;font-weight:900;margin-bottom:2px}
.class-teacher{text-align:center;font-size:12px;font-weight:bold;margin-bottom:8px}
table{width:100%;border-collapse:collapse;border:2px solid #000;font-size:11px;text-align:center}
th,td{border:1px solid #000;padding:3px 2px;height:42px}
th{background:#fff;font-size:9px;line-height:10px}
td:first-child{font-size:16px;font-weight:bold}
@media(max-width:850px){.paper{width:calc(100% - 20px)}}
</style>
</head>
<body>
<div id="asc-print">
  <div class="ribbon-top">Main File Specification View Timetable Options Help Print preview</div>
  <div class="ribbon-2">Previous page | Next page | Print | Select your report: Timetable for each class | Page: 1/17 | Filter | Global settings | Modify structure | Extra columns/rows | Style | Sizes/widths | Design: Standard | Colors | Close preview</div>
  <div class="paper">
    <div class="title"></div>
    <div class="class-teacher"></div>
    <table id="ascTable"></table>
  </div>
</div>
<script>
const asc = {
  class: "GRADE 4",
  teacher: "MOMANYI POLYTON, CHERWONY MERCY",
  periods: [1,"SHORT BREAK",2,3,"TEA BREAK",4,5,"LUNCH",6,7,"GAMES",8],
  days: ["MO","TU","WE","TH","FR"]
};

document.querySelector('.title').innerText = asc.class;
document.querySelector('.class-teacher').innerText = "Class teacher: "+asc.teacher;

let h="<tr><th></th>"+asc.periods.map(p=>`<th>${p}</th>`).join('')+"</tr>";
asc.days.forEach(d=>{
  h+=`<tr><td>${d}</td>`+asc.periods.map(p=>`<td data-day="${d}" data-period="${p}"></td>`).join('')+"</tr>";
});
document.getElementById('ascTable').innerHTML=h;
</script>
</body>
</html>
