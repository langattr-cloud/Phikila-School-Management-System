<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2A47" />
    <meta name="description" content="Phikila brings school records, academics, timetables, attendance, finance, and reporting into one clear operating system." />

    <!-- Stitch design system fonts (Geist, Inter, JetBrains Mono) + Material Symbols -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/timetable-print.css" />

    <!-- SVG favicon for modern browsers; .ico carries 16/32/48 for the rest. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="Phikila — School operations, in one place" />
    <meta property="og:description" content="One connected system for school records, academics, scheduling, attendance, finance, and reporting." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Phikila — School operations, in one place</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const updateTimetablePrintMetadata = () => {
          const header = document.querySelector('.timetable-print-header h1');
          const scope = document.querySelector('#tt-scope');
          const target = document.querySelector('#tt-target option:checked');
          if (!header) return;

          if (!header.dataset.phikilaOriginalTitle) {
            header.dataset.phikilaOriginalTitle = header.textContent || '';
          }

          const scopeValue = scope?.value || 'all';
          const selectedName = target?.textContent?.trim() || '';
          const title = scopeValue !== 'all' && selectedName
            ? selectedName
            : header.dataset.phikilaOriginalTitle || 'WHOLE SCHOOL TIMETABLE';

          header.textContent = title;
          document.title = title;

          const now = new Date();
          const pad = (value) => String(value).padStart(2, '0');
          document.body.dataset.phikilaPrintTime = `Printed: ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        };

        const restoreTimetablePrintMetadata = () => {
          const header = document.querySelector('.timetable-print-header h1');
          if (header?.dataset.phikilaOriginalTitle) {
            header.textContent = header.dataset.phikilaOriginalTitle;
          }
          document.title = 'Phikila — School operations, in one place';
          delete document.body.dataset.phikilaPrintTime;
        };

        window.addEventListener('beforeprint', updateTimetablePrintMetadata);
        window.addEventListener('afterprint', restoreTimetablePrintMetadata);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
