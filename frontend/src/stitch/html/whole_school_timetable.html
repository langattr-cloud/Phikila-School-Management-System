<!DOCTYPE html><html class="light" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whole School Timetable</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f9fb;color:#17212b}.shell{height:100vh;display:flex}.side{width:240px;background:#102a43;color:#fff;flex:none;padding:20px}.side h2{margin:0 0 4px}.side p{font-size:11px;opacity:.65;text-transform:uppercase}.nav{margin-top:30px}.nav div{padding:13px 10px;color:#cbd5e1}.nav .active{background:#ffffff18;color:#fff;border-left:4px solid #fff}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:72px;background:#fff;border-bottom:1px solid #d9dee7;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}.title{font-size:20px;font-weight:700}.sub{font-size:12px;color:#64748b;margin-top:3px}.tools{display:flex;gap:8px}.tools button,.tools select{padding:8px 12px;border:1px solid #cbd5e1;border-radius:5px;background:#fff}.tools .publish{background:#183247;color:#fff}.content{padding:18px;overflow:auto}.grid{display:grid;grid-template-columns:125px repeat(25,125px);min-width:3250px;border-top:1px solid #cbd5e1;border-left:1px solid #cbd5e1;background:#fff}.cell{border-right:1px solid #d9dee7;border-bottom:1px solid #d9dee7;min-height:74px}.corner{grid-row:1/3;position:sticky;left:0;z-index:8;background:#e9eef3;padding:12px;font-weight:700}.day{grid-row:1;background:#dfe7ee;padding:11px 8px;text-align:center;font-size:13px;font-weight:800;position:sticky;top:0;z-index:6}.time{grid-row:2;background:#f3f6f8;padding:8px;text-align:center;font-size:11px;font-weight:700;color:#475569;position:sticky;top:38px;z-index:6}.label{position:sticky;left:0;z-index:5;background:#f8fafc;padding:12px 9px;font-weight:800;font-size:12px}.lesson{margin:6px;padding:7px;border-left:3px solid #284b63;background:#f1f5f9;border-radius:4px;font-size:11px;line-height:1.35}.lesson b{display:block;font-size:12px}.empty{min-height:74px}.grade{color:#284b63}
</style></head><body><div class="shell"><aside class="side"><h2>Phikila OS</h2><p>Admin Console</p><div class="nav"><div>Dashboard</div><div>Academics</div><div>Students</div><div class="active">Timetable</div><div>Finance</div><div>Settings</div></div></aside><section class="main"><header class="top"><div><div class="title">Whole School Timetable</div><div class="sub">Grades 4–9 · Streams A, B, C · Monday–Friday · 08:00–13:00</div></div><div class="tools"><select><option>All Streams</option><option>Stream A</option><option>Stream B</option><option>Stream C</option></select><button>Print</button><button class="publish">Publish</button></div></header><main class="content"><div id="grid" class="grid"></div></main></section></div><script>
const days=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
const times=['08:00','09:00','10:00','11:00','12:00'];
const subjects=['Mathematics','English','Science','Kiswahili','Social Studies','ICT','PE','CRE'];
const teachers=['Mr Kamau','Ms Njeri','Mr Otieno','Ms Achieng','Mr Mwangi','Ms Wanjiku'];
const grid=document.getElementById('grid');
const add=(html,cls='cell')=>{const e=document.createElement('div');e.className=cls+' cell';e.innerHTML=html;grid.appendChild(e)};
add('GRADE / STREAM','corner');
days.forEach(d=>{const e=document.createElement('div');e.className='day cell';e.style.gridColumn='span 5';e.textContent=d;grid.appendChild(e)});
days.forEach(()=>times.forEach(t=>{const e=document.createElement('div');e.className='time cell';e.textContent=t;grid.appendChild(e)}));
for(let g=4;g<=9;g++)for(let s of ['A','B','C']){
 add('<span class="grade">GRADE '+g+'</span><br>'+s,'label');
 for(let d=0;d<5;d++)for(let t=0;t<5;t++){
  const idx=(g*3+s.charCodeAt(0)+d*2+t)%subjects.length;
  const show=(t+d+g+s.charCodeAt(0))%3!==0;
  add(show?'<div class="lesson"><b>'+subjects[idx]+'</b>'+teachers[(g+d+t)%teachers.length]+'</div>':'','empty');
 }
}
</script></body></html>
