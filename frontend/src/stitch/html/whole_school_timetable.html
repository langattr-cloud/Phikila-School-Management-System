<div class="wst"><style>
.wst{height:100%;display:flex;flex-direction:column;background:#f4f6f8;color:#17212b;font-family:Arial,sans-serif}.wst-toolbar{height:64px;flex:none;background:#fff;border-bottom:1px solid #d5dbe1;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}.wst-title{font-size:19px;font-weight:700}.wst-sub{font-size:11px;color:#64748b;margin-top:3px}.wst-actions{display:flex;gap:7px}.wst-actions select,.wst-actions button{height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;padding:0 10px;font-size:12px}.wst-actions .publish{background:#183247;color:#fff}.wst-scroll{flex:1;overflow:auto;padding:12px}.wst-table{display:grid;grid-template-columns:72px repeat(50,34px);min-width:1772px;border-top:1px solid #9ca8b3;border-left:1px solid #9ca8b3;background:#fff}.wst-cell{border-right:1px solid #c4ccd4;border-bottom:1px solid #c4ccd4;min-width:0}.wst-corner{grid-row:1/3;position:sticky;left:0;z-index:20;background:#e7ecf0;font-weight:800;font-size:10px;padding:8px 5px;text-align:center}.wst-day{height:26px;background:#dfe5e9;text-align:center;font-size:10px;font-weight:800;line-height:26px;position:sticky;top:0;z-index:10}.wst-time{height:25px;background:#f1f4f6;text-align:center;font-size:8px;font-weight:700;line-height:25px;position:sticky;top:26px;z-index:10}.wst-label{height:39px;position:sticky;left:0;z-index:8;background:#eef2f4;font-size:10px;font-weight:800;padding:0 4px;display:flex;align-items:center;justify-content:center}.wst-grade{color:#284b63}.wst-lesson{height:38px;padding:3px 2px;text-align:center;font-size:8px;font-weight:800;line-height:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}.wst-lesson span{display:block}.wst-empty{height:39px}.wst-break{background:#f5f5f5;color:#94a3b8}.wst-day-start{border-left:2px solid #7c8a96!important}.wst-note{font-size:10px;color:#64748b;margin:8px 0 0 2px}.wst-legend{display:flex;gap:12px;margin:7px 0 0 2px;font-size:10px;color:#64748b}.wst-dot{display:inline-block;width:9px;height:9px;border:1px solid #b8c1c9;margin-right:3px;vertical-align:-1px}
</style><header class="wst-toolbar"><div><div class="wst-title">Whole School Timetable</div><div class="wst-sub">Grades 4–9 · Streams A, B, C · All days shown horizontally</div></div><div class="wst-actions"><select><option>Whole School</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option></select><button>Print</button><button class="publish">Publish</button></div></header><main class="wst-scroll"><div id="wstTable" class="wst-table"></div><div class="wst-note">The left column is fixed. Each day contains its periods/times in a single horizontal school-wide matrix.</div><div class="wst-legend"><span><i class="wst-dot"></i>Lesson</span><span><i class="wst-dot"></i>Free period / break</span></div></main><script>
(function(){
const days=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
const times=['08:00','08:40','09:20','10:00','10:40','11:20','12:00','13:00','14:00','15:00'];
const subjects=['ENG','MAT','SCI','SST','KIS','CAS','AGR','CRE','ICT','PTS'];
const streams=['A','B','C'];
const table=document.getElementById('wstTable');
function cell(html,cls){const e=document.createElement('div');e.className='wst-cell '+cls;e.innerHTML=html||'';table.appendChild(e);return e}
cell('GRADE / STREAM','wst-corner');
days.forEach((d,di)=>{const e=cell(d,'wst-day');e.style.gridColumn='span 10';if(di>0)e.style.borderLeft='2px solid #7c8a96'});
days.forEach((d,di)=>times.forEach((t,ti)=>cell(t,'wst-time '+(ti===0?'wst-day-start':''))));
for(let grade=4;grade<=9;grade++)for(let si=0;si<streams.length;si++){
 const stream=streams[si];
 cell('<span class="wst-grade">'+grade+stream+'</span>','wst-label');
 days.forEach((day,di)=>times.forEach((time,ti)=>{
   const n=(grade*17+si*11+di*7+ti*5)%13;
   const free=n===0||n===7;
   const subject=subjects[(grade+si+di+ti)%subjects.length];
   const e=cell(free?'':'<div class="wst-lesson"><span>'+subject+'</span></div>',free?'wst-empty':'');
   if(ti===0)e.classList.add('wst-day-start');
 }));
}
})();
</script></div>
