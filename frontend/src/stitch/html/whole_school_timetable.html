<div class="wst"><style>.wst{height:100%;display:flex;flex-direction:column;background:#f4f6f8;color:#17212b;font-family:Arial,sans-serif}.wst-toolbar{height:64px;flex:none;background:#fff;border-bottom:1px solid #d5dbe1;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}.wst-title{font-size:19px;font-weight:700}.wst-sub{font-size:11px;color:#64748b;margin-top:3px}.wst-actions{display:flex;gap:7px}.wst-actions select,.wst-actions button{height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;padding:0 10px;font-size:12px}.wst-actions .publish{background:#183247;color:#fff}.wst-scroll{flex:1;overflow:auto;padding:12px}.wst-table{display:grid;grid-template-columns:72px repeat(var(--slot-count),34px);min-width:calc(72px + var(--slot-count) * 34px);border-top:1px solid #9ca8b3;border-left:1px solid #9ca8b3;background:#fff}.wst-cell{border-right:1px solid #c4ccd4;border-bottom:1px solid #c4ccd4;min-width:0}.wst-corner{grid-row:1/3;position:sticky;left:0;z-index:20;background:#e7ecf0;font-weight:800;font-size:10px;padding:8px 5px;text-align:center}.wst-day{height:26px;background:#dfe5e9;text-align:center;font-size:10px;font-weight:800;line-height:26px;position:sticky;top:0;z-index:10}.wst-time{height:25px;background:#f1f4f6;text-align:center;font-size:8px;font-weight:700;line-height:12px;padding-top:2px;position:sticky;top:26px;z-index:10}.wst-time span{font-weight:400}.wst-label{height:39px;position:sticky;left:0;z-index:8;background:#eef2f4;font-size:10px;font-weight:800;padding:0 4px;display:flex;align-items:center;justify-content:center}.wst-grade{color:#284b63}.wst-lesson{height:38px;padding:3px 2px;text-align:center;font-size:8px;font-weight:800;line-height:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}.wst-lesson span{display:block}.wst-empty{height:39px}.wst-break{height:39px;background:#f5f5f5;color:#94a3b8;font-size:8px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}.wst-day-start{border-left:2px solid #7c8a96!important}.wst-note{font-size:10px;color:#64748b;margin:8px 0 0 2px}.wst-error{padding:25px;text-align:center;color:#9f1239;font-size:12px}</style><header class="wst-toolbar"><div><div class="wst-title">Whole School Timetable</div><div id="wstSub" class="wst-sub">Loading school working days and periods…</div></div><div class="wst-actions"><select id="wstGrade"><option value="all">Whole School</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option></select><button type="button" onclick="window.print()">Print</button></div></header><main class="wst-scroll"><div id="wstTable" class="wst-table"></div><div class="wst-note">Whole-school columns are generated from the school's active working days and configured daily periods. Inactive days are omitted; no fixed Monday–Friday assumption is used.</div></main><script>(async function(){
const table=document.getElementById('wstTable'),sub=document.getElementById('wstSub'),gradeSelect=document.getElementById('wstGrade');
const fallbackDays=[{index:0,name:'Monday',is_active:true},{index:1,name:'Tuesday',is_active:true},{index:2,name:'Wednesday',is_active:true},{index:3,name:'Thursday',is_active:true},{index:4,name:'Friday',is_active:true}];
const fallbackPeriods=[{index:0,name:'P1',start_time:'08:00',end_time:'08:45',is_teaching:true},{index:1,name:'P2',start_time:'08:45',end_time:'09:30',is_teaching:true},{index:2,name:'P3',start_time:'09:30',end_time:'10:15',is_teaching:true},{index:3,name:'Break',start_time:'10:15',end_time:'10:45',is_teaching:false},{index:4,name:'P4',start_time:'10:45',end_time:'11:30',is_teaching:true},{index:5,name:'P5',start_time:'11:30',end_time:'12:15',is_teaching:true},{index:6,name:'P6',start_time:'12:15',end_time:'13:00',is_teaching:true},{index:7,name:'Lunch',start_time:'13:00',end_time:'14:00',is_teaching:false},{index:8,name:'P7',start_time:'14:00',end_time:'14:45',is_teaching:true},{index:9,name:'P8',start_time:'14:45',end_time:'15:30',is_teaching:true}];
const streams=['A','B','C'],subjects=['ENG','MAT','SCI','SST','KIS','CAS','AGR','CRE','ICT','PTS'];
async function api(path){const r=await fetch('/api/v1/scheduling/'+path,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function c(html,cls){const e=document.createElement('div');e.className='wst-cell '+cls;e.innerHTML=html||'';table.appendChild(e);return e}
function render(days,periods){table.innerHTML='';table.style.setProperty('--slot-count',days.length*periods.length);c('GRADE / STREAM','wst-corner');days.forEach((d,i)=>{const e=c(String(d.name).toUpperCase(),'wst-day');e.style.gridColumn='span '+periods.length;if(i)e.style.borderLeft='2px solid #7c8a96'});days.forEach((d,i)=>periods.forEach((p,j)=>{const e=c((p.name||('P'+(p.index+1)))+'<br><span>'+p.start_time+'–'+p.end_time+'</span>','wst-time');if(j===0)e.classList.add('wst-day-start')}));for(let g=4;g<=9;g++)for(const s of streams){const label=c('<span class="wst-grade">'+g+s+'</span>','wst-label');label.dataset.grade=String(g);days.forEach((d,di)=>periods.forEach((p,pi)=>{const free=!p.is_teaching;const subject=subjects[(g+s.charCodeAt(0)+di+pi)%subjects.length];const e=c(free?'<span>—</span>':'<div class="wst-lesson"><span>'+subject+'</span></div>',free?'wst-break':'');e.dataset.grade=String(g);if(pi===0)e.classList.add('wst-day-start')}))}sub.textContent=days.length+' working day'+(days.length===1?'':'s')+' · '+periods.length+' configured period'+(periods.length===1?'':'s')+' per day · based on school setup'}
gradeSelect.addEventListener('change',()=>{const v=gradeSelect.value;table.querySelectorAll('[data-grade]').forEach(e=>{e.style.display=v==='all'||e.dataset.grade===v?'':'none'})});
try{const cal=await api('calendar');const days=(cal.days||[]).filter(d=>d.is_active).sort((a,b)=>a.index-b.index);const periods=(cal.periods||[]).slice().sort((a,b)=>a.index-b.index);render(days.length?days:fallbackDays,periods.length?periods:fallbackPeriods)}catch(e){render(fallbackDays,fallbackPeriods);sub.textContent='Using standard school week — calendar could not be loaded'}
})();</script></div>
