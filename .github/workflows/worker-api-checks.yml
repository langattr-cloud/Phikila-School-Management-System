name: Worker API checks

on:
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/worker-api-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - '.github/workflows/worker-api-checks.yml'

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Install worker dependencies
        run: npm ci
      - name: Type-check worker API
        run: npm run typecheck
      - name: Finance migration source regression checks
        run: npm run test:finance-migrations
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Execute finance migrations and PostgreSQL regression checks
        env:
          PGPASSWORD: postgres
        run: psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file tests/finance-migration-postgres.sql
      - name: Build worker API (dry run)
        run: npm run build
