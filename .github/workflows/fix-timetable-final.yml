name: Timetable validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate timetable source
        run: |
          test -f frontend/src/components/TimetableGrid.tsx
          test -f frontend/src/components/PublishedTimetableGrid.tsx
          test -f frontend/src/components/timetable-time-grid.css
          test -f frontend/src/components/timetable-view-helpers.ts
          grep -q 'lesson-card__subject' frontend/src/components/TimetableGrid.tsx
          grep -q 'lesson-card__class' frontend/src/components/TimetableGrid.tsx
          grep -q 'grid-template-columns:3.1rem' frontend/src/components/timetable-time-grid.css
          echo 'Timetable source validation passed.'
