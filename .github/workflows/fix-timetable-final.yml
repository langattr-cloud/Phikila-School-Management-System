name: Apply timetable routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch timetable page
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/TimetablePage.tsx')
          s = p.read_text()
          marker = "                meta={meta}\n                conflicted={conflicted}"
          insert = "                meta={meta}\n                view={filter.scope === 'class' ? 'class' : filter.scope === 'teacher' ? 'teacher' : 'whole-school'}\n                conflicted={conflicted}"
          if "view={filter.scope === 'class'" not in s:
              if marker not in s:
                  raise SystemExit('TimetableGrid render marker not found')
              s = s.replace(marker, insert, 1)
              p.write_text(s)
          if len(s) < 20000:
              raise SystemExit('TimetablePage unexpectedly incomplete')
          if "view={filter.scope === 'class' ? 'class' : filter.scope === 'teacher' ? 'teacher' : 'whole-school'}" not in s:
              raise SystemExit('View routing was not applied')
      - name: Commit application change and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/TimetablePage.tsx
          git rm .github/workflows/fix-timetable-final.yml
          git commit -m 'Route class and teacher timetables to separate grid'
          git push
