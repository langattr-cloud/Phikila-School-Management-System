name: Apply school code edit
on:
  push:
    branches:
      - fix/super-admin-school-code-edit
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/super-admin-school-code-edit
      - name: Update school code editing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/PlatformPage.tsx')
          s = p.read_text()
          s = s.replace("const [academicYear, setAcademicYear] = useState(''); const [email, setEmail]", "const [academicYear, setAcademicYear] = useState(''); const [slug, setSlug] = useState(''); const [email, setEmail]")
          s = s.replace("setAcademicYear(school.academic_year || ''); setEditing(true)", "setAcademicYear(school.academic_year || ''); setSlug(school.slug); setEditing(true)")
          old = "if (!school || saving) return; setSaving(true); try { const updated = await platform.updateSchool(school.id, { name: name.trim(), timezone: timezone.trim(), academic_year: academicYear.trim() || null });"
          new = "if (!school || saving) return; const normalizedSlug = slug.trim(); if (!/^[A-Za-z0-9][A-Za-z0-9-]*$/.test(normalizedSlug)) { notify('School code may contain only letters, numbers, and hyphens.', 'error'); return } setSaving(true); try { const updated = await platform.updateSchool(school.id, { name: name.trim(), slug: normalizedSlug, timezone: timezone.trim(), academic_year: academicYear.trim() || null });"
          if old not in s: raise SystemExit('frontend save block not found')
          s = s.replace(old, new)
          old = '<Field label="School code" value={school.slug} hint="The school code is the permanent platform identifier." disabled />'
          new = '<Field label="School code" required hint="Letters, numbers and hyphens. Existing capitalization and leading zeros are preserved." value={slug} onChange={e => setSlug(e.target.value)} />'
          if old not in s: raise SystemExit('frontend field not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('app/modules/platform/router.py')
          s = p.read_text()
          old = '''class SchoolPatch(BaseModel):\n    name: str | None = Field(default=None, min_length=3, max_length=160)\n    timezone: str | None = Field(default=None, max_length=60)\n    academic_year: str | None = Field(default=None, max_length=40)\n'''
          new = '''class SchoolPatch(BaseModel):\n    name: str | None = Field(default=None, min_length=3, max_length=160)\n    slug: str | None = Field(default=None, min_length=2, max_length=80)\n    timezone: str | None = Field(default=None, max_length=60)\n    academic_year: str | None = Field(default=None, max_length=40)\n\n    @field_validator("slug")\n    @classmethod\n    def clean_slug(cls, value: str | None) -> str | None:\n        if value is None:\n            return None\n        code = value.strip()\n        if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*", code):\n            raise ValueError("Use letters, numbers and hyphens only.")\n        return code\n'''
          if old not in s: raise SystemExit('backend schema block not found')
          s = s.replace(old, new)
          old = '''    for key, value in payload.model_dump(exclude_unset=True).items():\n        if value is not None:\n            setattr(school, key, value)\n'''
          new = '''    updates = payload.model_dump(exclude_unset=True)\n    if "slug" in updates and updates["slug"] is not None:\n        normalized_slug = updates["slug"].strip()\n        conflict = (\n            db.query(TtSchool)\n            .filter(TtSchool.slug == normalized_slug, TtSchool.id != school.id)\n            .first()\n        )\n        if conflict:\n            raise HTTPException(\n                status.HTTP_409_CONFLICT, "A school already uses that code."\n            )\n        updates["slug"] = normalized_slug\n    for key, value in updates.items():\n        if value is not None:\n            setattr(school, key, value)\n'''
          if old not in s: raise SystemExit('backend update block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/PlatformPage.tsx app/modules/platform/router.py
          git diff --cached --check
          git commit -m 'fix: allow super admins to edit school codes'
          git push origin HEAD:fix/super-admin-school-code-edit
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-school-code-edit.yml || true
          git commit -m 'chore: remove temporary edit workflow' || true
          git push origin HEAD:fix/super-admin-school-code-edit || true
