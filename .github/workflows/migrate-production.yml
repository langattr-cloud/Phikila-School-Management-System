name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE to confirm production migration"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out production code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate database secret
        run: |
          test -n "$DATABASE_URL" || {
            echo "DATABASE_URL GitHub Actions secret is not configured."
            exit 1
          }

      - name: Validate migration graph
        run: |
          alembic heads
          test "$(alembic heads | wc -l)" -eq 1

      - name: Baseline existing production schema
        run: |
          CURRENT="$(alembic current 2>/dev/null || true)"
          if [ -n "$CURRENT" ]; then
            echo "Alembic already has a recorded database revision:"
            echo "$CURRENT"
            exit 0
          fi

          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          baseline_tables = {
              "academic_years",
              "grade_levels",
              "lesson_periods",
              "school_info",
              "school_settings",
              "school_working_days",
              "streams",
              "terms",
              "timetable_entries",
              "timetables",
              "working_days",
              "timetable_allocations",
          }

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              rows = conn.execute(text("""
                  SELECT table_name
                  FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_name = ANY(:tables)
              """), {"tables": list(baseline_tables)})
              found = {row[0] for row in rows}

              missing = baseline_tables - found
              if missing == {"grade_levels", "school_working_days"}:
                  print("Production has the existing baseline schema except two empty foundation tables.")
                  print("Creating missing baseline tables before stamping 8b4a887cf966.")
                  conn.execute(text("""
                      CREATE TABLE IF NOT EXISTS grade_levels (
                          id INTEGER NOT NULL PRIMARY KEY
                      )
                  """))
                  conn.execute(text("""
                      CREATE TABLE IF NOT EXISTS school_working_days (
                          id INTEGER NOT NULL PRIMARY KEY
                      )
                  """))
                  conn.execute(text("""
                      CREATE INDEX IF NOT EXISTS ix_grade_levels_id
                      ON grade_levels (id)
                  """))
                  conn.execute(text("""
                      CREATE INDEX IF NOT EXISTS ix_school_working_days_id
                      ON school_working_days (id)
                  """))
                  missing = set()

              if missing:
                  print("Production database does not match the known existing baseline.")
                  print("Missing base tables:", ", ".join(sorted(missing)))
                  raise SystemExit(1)

          print("Existing baseline schema confirmed; stamping Alembic baseline 8b4a887cf966.")
          PY

          alembic stamp 8b4a887cf966

      - name: Show migration plan
        run: |
          alembic current
          alembic heads

      - name: Apply all production migrations
        run: alembic upgrade head

      - name: Verify migration state
        run: |
          alembic current
          test "$(alembic current | grep -c '(head)')" -ge 1
