name: Remove legacy time preference

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-time-preference
          fetch-depth: 0
      - name: Remove legacy feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          def edit(path, transform):
              p = root / path
              if p.exists():
                  old = p.read_text()
                  new = transform(old)
                  if new != old:
                      p.write_text(new)

          edit('app/modules/scheduling/models.py', lambda s: s.replace('; prefers_morning=Column(Boolean,default=False,nullable=False)', ''))
          edit('app/modules/scheduling/schemas.py', lambda s: re.sub(r'\n?    prefers_morning: bool = False;', '', s))

          def solver(s):
              s = re.sub(r'\n    prefers_morning: bool = False', '', s)
              s = re.sub(r'\n    morning_preference: int = 10', '', s)
              s = re.sub(r'\n    morning_periods: list\[int\]', '', s)
              s = re.sub(r'\n    # Soft: morning preference for subjects that ask for it\.\n    if w\.morning_preference > 0 and data\.morning_periods:.*?\n\n    # Soft: spread a subject across distinct days\.', '\n\n    # Soft: spread a subject across distinct days.', s, flags=re.S)
              s = re.sub(r'\n    # Morning preference adherence\n    morning = set\(data\.morning_periods\).*?\n    else:\n        morning_score = 100\.0\n', '\n', s, flags=re.S)
              s = s.replace('        "morning_preference": morning_score,\n', '')
              s = s.replace('        + morning_score * 0.06\n', '')
              s = s.replace('        + workload_score * 0.12\n        + dist_score * 0.14\n        + gap_score * 0.14\n        + class_score * 0.10\n        + room_score * 0.04', '        + workload_score * 0.14\n        + dist_score * 0.16\n        + gap_score * 0.15\n        + class_score * 0.10\n        + room_score * 0.05')
              return s
          edit('app/modules/scheduling/solver.py', solver)

          def engine(s):
              s = re.sub(r'\n    @property\n    def morning_indexes\(self\) -> list\[int\]:.*?\n\n\ndef load_calendar', '\n\n\ndef load_calendar', s, flags=re.S)
              s = re.sub(r'\n            prefers_morning=bool\(s\.prefers_morning\),', '', s)
              s = re.sub(r'\n        morning_periods=calendar\.morning_indexes,', '', s)
              return s
          edit('app/modules/scheduling/engine.py', engine)

          def copilot(s):
              s = re.sub(r'\n    "morning": "morning_preference",', '', s)
              s = re.sub(r'\n    def morning_periods\(self\) -> list\[dict\]:.*?\n\n\ndef _match_name', '\n\n\ndef _match_name', s, flags=re.S)
              return s
          edit('app/modules/scheduling/copilot.py', copilot)

          for path in ['frontend/src/pages/SetupPage.tsx', 'frontend/src/components/SubjectColourManager.tsx']:
              edit(path, lambda s: re.sub(r',\s*prefers_morning:\s*[^,}]+|prefers_morning:\s*[^,}]+,|\s+prefers_morning\??:\s*boolean;?', '', s))

          # Remove legacy preference constraint rows through a migration when the app supports migrations.
          migration_dir = root / 'app/modules/scheduling/migrations'
          if migration_dir.exists():
              (migration_dir / '002_remove_time_preference.py').write_text('from sqlalchemy import text\n\n\ndef upgrade(connection):\n    connection.execute(text("DELETE FROM tt_constraints WHERE kind = \'morning_preference\'"))\n\n\ndef downgrade(connection):\n    pass\n')

          leftovers = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix not in {'.py', '.ts', '.tsx', '.sql', '.md'}:
                  continue
              try: text = p.read_text()
              except UnicodeDecodeError: continue
              for needle in ('morning_preference', 'morning_periods', 'prefers_morning'):
                  if needle in text: leftovers.append(f'{p}: {needle}')
          if leftovers: raise SystemExit('Legacy time preference references remain:\n' + '\n'.join(leftovers))
          PY
          rm -f .github/workflows/remove-time-preference-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: trigger complete time preference removal' || exit 0
          git push origin fix/remove-time-preference
