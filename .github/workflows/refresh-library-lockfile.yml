name: Refresh frontend dependency lockfile

on:
  push:
    branches:
      - release/library-timetable-custody-2026-11-03
    paths:
      - 'frontend/package.json'
      - '.github/workflows/refresh-library-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/library-timetable-custody-2026-11-03
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve patched dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Refresh frontend lockfile with patched minimatch"
            git push origin HEAD:release/library-timetable-custody-2026-11-03
          fi
