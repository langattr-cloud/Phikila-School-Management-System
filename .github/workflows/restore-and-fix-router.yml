name: Restore and fix scheduling router
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scheduling router
        shell: bash
        run: |
          grep -q '"/versions/{version_id}/publish"' app/modules/scheduling/router.py
          grep -q 'list_classes_with_academic_setup' app/modules/scheduling/router.py
          echo "Scheduling router contains the publish endpoint and academic setup mapping."
