name: Encrypted database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/encrypted-database-backup.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-database-backup.yml'

permissions:
  contents: read

concurrency:
  group: phikila-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt, and retain Supabase database backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install encryption tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.113.0

      - name: Validate configuration
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing SUPABASE_DB_URL secret"; exit 1; }
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI"; exit 1 ;;
          esac
          case "$BACKUP_AGE_RECIPIENT" in
            age1*) ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT must be an age public recipient (age1...)"; exit 1 ;;
          esac

      - name: Export Supabase-compatible logical database files
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR="$RUNNER_TEMP/phikila-backup"
          mkdir -p "$BACKUP_DIR"

          # Supabase CLI filters managed/internal schemas from its logical dumps.
          # The output covers application schemas, roles, and application data.
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$BACKUP_DIR/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$BACKUP_DIR/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$BACKUP_DIR/data.sql" --use-copy --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          test -s "$BACKUP_DIR/roles.sql"
          test -s "$BACKUP_DIR/schema.sql"
          test -s "$BACKUP_DIR/data.sql"

      - name: Encrypt and checksum backup
        if: github.event_name != 'pull_request'
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          BACKUP_DIR="$RUNNER_TEMP/phikila-backup"
          ARCHIVE="$RUNNER_TEMP/phikila-${STAMP}.tar.gz"
          ENCRYPTED="$ARCHIVE.age"
          CHECKSUM="$ENCRYPTED.sha256"

          tar -C "$RUNNER_TEMP" -czf "$ARCHIVE" phikila-backup
          age --recipient "$BACKUP_AGE_RECIPIENT" --output "$ENCRYPTED" "$ARCHIVE"
          test -s "$ENCRYPTED"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$ENCRYPTED")" > "$(basename "$CHECKSUM")")
          (cd "$RUNNER_TEMP" && sha256sum --check "$(basename "$CHECKSUM")")

          rm -f "$ARCHIVE"
          rm -rf "$BACKUP_DIR"

      - name: Store encrypted backup as a short-lived workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phikila-encrypted-db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phikila-*.tar.gz.age
            ${{ runner.temp }}/phikila-*.tar.gz.age.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove temporary backup files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/phikila-backup"
          rm -f "$RUNNER_TEMP"/phikila-*.tar.gz "$RUNNER_TEMP"/phikila-*.tar.gz.age "$RUNNER_TEMP"/phikila-*.tar.gz.age.sha256
