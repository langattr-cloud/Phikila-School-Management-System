name: Frontend dependency security

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-dependency-security.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frontend-dependency-security
  cancel-in-progress: false

jobs:
  propose-safe-audit-fixes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Apply compatible security fixes
        run: npm audit fix || true

      - name: Check shared class lessons regression guards
        run: node scripts/check-shared-class-lessons.mjs

      - name: Type-check and build frontend
        run: npm run build

      - name: Open dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/automated-frontend-audit-fixes
          delete-branch: false
          commit-message: 'fix: update vulnerable frontend dependencies'
          title: 'Fix vulnerable frontend dependencies'
          body: |
            ## Automated dependency security update

            - Applies compatible fixes reported by npm audit.
            - Runs the class-lesson regression checks.
            - Runs the TypeScript check and production frontend build before opening this PR.

            Review the updated lockfile and audit report before merging. This workflow does not deploy dependency changes directly to production.
          add-paths: |
            frontend/package-lock.json
