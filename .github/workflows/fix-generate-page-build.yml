name: Fix GeneratePage build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused grade display helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/GeneratePage.tsx')
          s = p.read_text()
          target = "function gradeDisplayName(name: string) { const value = name.trim(); const match = value.match(/(?:grade|gr)\\s*([0-9]+)\\s*[-–—:\\s]*([A-Za-z0-9]+)?/i); if (!match) return value.replace(/^(grade|gr)\\s*/i,'').trim(); return match[2] ? `${match[1]}${match[2].charAt(0).toUpperCase()}` : match[1] }\n"
          if target not in s:
              raise SystemExit('gradeDisplayName declaration not found; refusing to modify the file')
          p.write_text(s.replace(target, '', 1))
          PY
      - name: Commit build fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/GeneratePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove unused timetable grade helper'
          git push
