name: Backend tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run complete backend unittest suite
        run: python -m unittest discover -s app -t . -p 'test*.py' -v
