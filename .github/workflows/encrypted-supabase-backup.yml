name: Encrypted Supabase database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phikila-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, and upload to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -eu
          for key in SUPABASE_DB_URL R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY BACKUP_AGE_RECIPIENT; do
            eval 'value=${'"$key"'-}'
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret or variable: $key"
              exit 1
            fi
          done
          case "$BACKUP_AGE_RECIPIENT" in
            age1*) ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT must be an age public recipient (age1...)."; exit 1 ;;
          esac

      - name: Create encrypted database dump and upload to R2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_TIMESTAMP: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          docker run --rm \
            -e SUPABASE_DB_URL \
            -e R2_ACCOUNT_ID \
            -e R2_BUCKET \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e BACKUP_AGE_RECIPIENT \
            -e BACKUP_TIMESTAMP \
            -v "$RUNNER_TEMP:/backup" \
            postgres:17-alpine sh -euc '
              apk add --no-cache age aws-cli
              pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file=/backup/phikila.dump
              age --recipient "$BACKUP_AGE_RECIPIENT" --output /backup/phikila.dump.age /backup/phikila.dump
              rm -f /backup/phikila.dump
              test -s /backup/phikila.dump.age
              sha256sum /backup/phikila.dump.age > /backup/phikila.dump.age.sha256
              export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
              export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
              export AWS_DEFAULT_REGION=auto
              endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
              key="postgres/daily/$(date -u +%Y/%m/%d)/phikila-$BACKUP_TIMESTAMP.dump.age"
              aws --endpoint-url "$endpoint" s3 cp /backup/phikila.dump.age "s3://$R2_BUCKET/$key" --only-show-errors
              aws --endpoint-url "$endpoint" s3 cp /backup/phikila.dump.age.sha256 "s3://$R2_BUCKET/$key.sha256" --only-show-errors
              aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key "$key" >/dev/null
              echo "Encrypted backup upload verified: s3://$R2_BUCKET/$key"
            '
      - name: Clean up runner files
        if: always()
        run: rm -f "$RUNNER_TEMP/phikila.dump" "$RUNNER_TEMP/phikila.dump.age" "$RUNNER_TEMP/phikila.dump.age.sha256"
