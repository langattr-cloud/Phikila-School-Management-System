name: Apply lesson staging order

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply lesson staging row order
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/GeneratePage.tsx')
          text = p.read_text()
          old = "const rows = classes.length ? classes : Array.from(new Map(requirements.map(r => [r.class_id, { id: r.class_id, name: r.class_name || 'Grade / class' }])).values());"
          new = "const rows = (classes.length ? classes : Array.from(new Map(requirements.map(r => [r.class_id, { id: r.class_id, name: r.class_name || 'Grade / class' }])).values())).slice().sort((a,b) => { const label = (x: SchoolClass) => String(x.academic_stream || x.name || x.grade || '').trim().toUpperCase(); const rank = (x: SchoolClass) => { const s = label(x); const n = Number(s.match(/\\d+/)?.[0] || 999); const stream = s.replace(/^\\d+/, ''); const streamRank = stream === '' ? 0 : stream === 'E' ? 1 : stream === 'W' ? 2 : stream === 'N' ? 3 : 9; return [n, streamRank, s]; }; const ra=rank(a), rb=rank(b); return ra[0]-rb[0] || ra[1]-rb[1] || String(ra[2]).localeCompare(String(rb[2])); });"
          if old not in text:
              raise SystemExit('Target rows expression not found; refusing to modify the file.')
          if new not in text:
              text = text.replace(old, new, 1)
              p.write_text(text)

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-lesson-staging-order.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/GeneratePage.tsx .github/workflows/apply-lesson-staging-order.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: order lesson staging board by grade and stream"
          git push