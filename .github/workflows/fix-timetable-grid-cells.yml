name: Fix timetable grid cell selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: apply timetable grid cell selection') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timetable grid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/TimetableGrid.tsx')
          s = p.read_text()
          old = "const [dragging, setDragging] = useState<Lesson | null>(null); const [carrying, setCarrying] = useState<Lesson | null>(null); const [hovered, setHovered] = useState<string | null>(null); const [printSettings, setPrintSettings] = useState<PrintLabelSettings>(() => ({ ...DEFAULT_PRINT_LABEL_SETTINGS, timeFormat, timeLayout })); const [printSettingsOpen, setPrintSettingsOpen] = useState(false)"
          new = "const [dragging, setDragging] = useState<Lesson | null>(null); const [carrying, setCarrying] = useState<Lesson | null>(null); const [hovered, setHovered] = useState<string | null>(null); const [selectedAppearanceKey, setSelectedAppearanceKey] = useState<string | null>(null); const [printSettings, setPrintSettings] = useState<PrintLabelSettings>(() => ({ ...DEFAULT_PRINT_LABEL_SETTINGS, timeFormat, timeLayout })); const [printSettingsOpen, setPrintSettingsOpen] = useState(false)"
          if old in s:
              s = s.replace(old, new, 1)
          old = "const selectAppearanceCell = (type: 'lesson' | 'period' | 'day', label: string, details: { day?: number; period?: number; lessonId?: number } = {}) => { window.dispatchEvent(new CustomEvent('phikila:timetable-cell-selected', { detail: { type, label, ...details } })) }"
          new = "const selectAppearanceCell = (type: 'lesson' | 'period' | 'day', label: string, details: { day?: number; period?: number; lessonId?: number } = {}) => { const key = `${type}:${details.day ?? ''}:${details.period ?? ''}:${details.lessonId ?? ''}`; setSelectedAppearanceKey(key); window.dispatchEvent(new CustomEvent('phikila:timetable-cell-selected', { detail: { type, label, ...details } })) }"
          if old in s:
              s = s.replace(old, new, 1)
          old = "isTarget ? 'timetable__cell--target' : '', cellLessons.length === 0 ? 'timetable__cell--empty' : ''].filter(Boolean).join(' ')} tabIndex={readOnly ? -1 : 0} aria-label={`${dayLabel(day)}, ${period.name}`} onClick={() => period.is_teaching && selectAppearanceCell('period', `${period.name} ${periodTime(period)}`, { period: period.index })}"
          new = "isTarget ? 'timetable__cell--target' : '', cellLessons.length === 0 ? 'timetable__cell--empty' : '', selectedAppearanceKey === `lesson:${day.index}:${period.index}:${cellLessons[0]?.id ?? ''}` || selectedAppearanceKey === `period:${day.index}:${period.index}:` ? 'timetable__cell--appearance-selected' : ''].filter(Boolean).join(' ')} tabIndex={readOnly ? -1 : 0} aria-label={`${dayLabel(day)}, ${period.name}`} onClick={() => period.is_teaching && selectAppearanceCell(cellLessons.length ? 'lesson' : 'period', cellLessons.length ? (meta.subjects.get(cellLessons[0].subject_id)?.name ?? 'Lesson') : `${period.name} ${periodTime(period)}`, { period: period.index, day: day.index, lessonId: cellLessons[0]?.id })}"
          if old in s:
              s = s.replace(old, new, 1)
          old = "onClick={() => period.is_teaching && selectAppearanceCell('period', `${period.name} ${periodTime(period)}`, { day: day.index, period: period.index })} {...slotHandlers(key, day.index, period.index, isBreak)}"
          new = "onClick={() => period.is_teaching && selectAppearanceCell(cellLessons.length ? 'lesson' : 'period', cellLessons.length ? (meta.subjects.get(cellLessons[0].subject_id)?.name ?? 'Lesson') : `${period.name} ${periodTime(period)}`, { day: day.index, period: period.index, lessonId: cellLessons[0]?.id })} {...slotHandlers(key, day.index, period.index, isBreak)}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          css = Path('frontend/src/components/timetable-time-grid.css')
          c = css.read_text()
          rule = '.timetable__cell--appearance-selected,.timetable__whole-slot--appearance-selected{box-shadow:inset 0 0 0 2px var(--color-primary);position:relative;z-index:2}'
          if rule not in c:
              css.write_text(c + '\n' + rule + '\n')
          PY
      - name: Verify patch
        run: |
          grep -q "selectedAppearanceKey" frontend/src/components/TimetableGrid.tsx
          grep -q "timetable__cell--appearance-selected" frontend/src/components/TimetableGrid.tsx
          grep -q "timetable__cell--appearance-selected" frontend/src/components/timetable-time-grid.css
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/TimetableGrid.tsx frontend/src/components/timetable-time-grid.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply timetable grid cell selection"
          git push
