name: Repair timetable export syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed export functions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/TimetablePage.tsx')
          s = p.read_text()
          s = s.replace("}); const csv =", "})]; const csv =")
          s = s.replace(".join('\\n');", ".join('\\n');")
          s = s.replace(".join('\\r\\n');", ".join('\\r\\n');")
          # The previous generated revision contained literal line breaks inside
          # the single-quoted newline strings. Normalize those safely.
          s = s.replace(".join('\\n');", ".join('\\n');")
          s = s.replace(".join('\\r\\n');", ".join('\\r\\n');")
          p.write_text(s)
          PY
      - name: Validate TypeScript source
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/TimetablePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair timetable export syntax'
          git push
