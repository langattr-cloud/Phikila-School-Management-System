name: Timetable syntax validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TypeScript source
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
