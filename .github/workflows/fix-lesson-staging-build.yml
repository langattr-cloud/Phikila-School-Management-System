name: Fix lesson staging sort build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix TypeScript comparator
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/GeneratePage.tsx')
          text = p.read_text()
          old = "return ra[0]-rb[0] || ra[1]-rb[1] || String(ra[2]).localeCompare(String(rb[2]));"
          new = "return Number(ra[0])-Number(rb[0]) || Number(ra[1])-Number(rb[1]) || String(ra[2]).localeCompare(String(rb[2]));"
          if old not in text:
              raise SystemExit('Expected comparator not found; refusing to modify source.')
          p.write_text(text.replace(old, new, 1))
      - name: Remove repair workflow
        run: rm -f .github/workflows/fix-lesson-staging-build.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/GeneratePage.tsx .github/workflows/fix-lesson-staging-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: correct lesson staging sort comparator types"
          git push