name: Trigger time preference removal
on:
  push:
    branches: [fix/remove-time-preference-v2]
    paths-ignore:
      - .github/workflows/remove-time-fields-trigger.yml
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: trigger time preference cleanup'
          git push
