name: Apply timetable solver worker integration

on:
  push:
    branches:
      - agent/timetable-solver-worker

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scheduling runtime
        shell: python
        run: |
          from pathlib import Path

          solver = Path('app/modules/scheduling/solver.py')
          text = solver.read_text()
          old = '''try:  # pragma: no cover - exercised implicitly by the API\n    from ortools.sat.python import cp_model\n\n    ORTOOLS_AVAILABLE = True\nexcept ImportError:  # pragma: no cover\n    cp_model = None  # type: ignore[assignment]\n    ORTOOLS_AVAILABLE = False'''
          new = '''import os\n\ntry:  # pragma: no cover - exercised implicitly by the API\n    from ortools.sat.python import cp_model\n\n    ORTOOLS_AVAILABLE = True\nexcept ImportError:  # pragma: no cover\n    cp_model = None  # type: ignore[assignment]\n    # The public API may live on Vercel while the CP-SAT engine runs in the\n    # dedicated worker. The API only needs to know that a worker is configured.\n    ORTOOLS_AVAILABLE = bool(os.getenv("SOLVER_WORKER_URL"))'''
          if old not in text:
              raise SystemExit('solver import block not found')
          solver.write_text(text.replace(old, new, 1))

          jobs = Path('app/modules/scheduling/jobs.py')
          jobs.write_text('''"""Database-backed solver job execution and worker dispatch."""\nfrom __future__ import annotations\n\nimport logging\nimport os\nfrom datetime import datetime\n\nimport requests\nfrom sqlalchemy.orm import Session\n\nfrom app.core.database import SessionLocal\nfrom . import models as m\nfrom .engine import build_input\nfrom .solver import ORTOOLS_AVAILABLE, preflight, solve\n\nlogger = logging.getLogger(__name__)\n\nCHECKS = [\n    {"key": "teacher_conflicts", "label": "Teacher conflicts", "group": "hard"},\n    {"key": "class_conflicts", "label": "Class conflicts", "group": "hard"},\n    {"key": "room_conflicts", "label": "Room conflicts", "group": "hard"},\n    {"key": "availability", "label": "Availability", "group": "hard"},\n    {"key": "workload", "label": "Workload balance", "group": "soft"},\n    {"key": "distribution", "label": "Subject distribution", "group": "soft"},\n    {"key": "preferences", "label": "Time preferences", "group": "soft"},\n]\nDEFAULT_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]\nDEFAULT_PERIODS = [(0,"P1","08:00","08:45",True),(1,"P2","08:45","09:30",True),(2,"P3","09:30","10:15",True),(3,"Break","10:15","10:45",False),(4,"P4","10:45","11:30",True),(5,"P5","11:30","12:15",True),(6,"P6","12:15","13:00",True),(7,"Lunch","13:00","14:00",False),(8,"P7","14:00","14:45",True),(9,"P8","14:45","15:30",True)]\n\ndef initial_checks(): return [{**c,"state":"pending"} for c in CHECKS]\n\ndef create_job(db: Session, school_id: int, actor: str | None):\n    job = m.TtSolverJob(school_id=school_id,status="queued",stage="Queued",progress=0,checks=initial_checks(),created_by=actor)\n    db.add(job); db.commit(); db.refresh(job); return job\n\ndef enqueue(job_id: int, school_id: int, max_seconds: float = 30.0):\n    worker_url = os.getenv("SOLVER_WORKER_URL", "").rstrip("/")\n    if not worker_url:\n        _run_job(job_id, school_id, max_seconds)\n        return\n    token = os.getenv("SOLVER_WORKER_TOKEN", "")\n    try:\n        response = requests.post(\n            f"{worker_url}/run",\n            json={"job_id": job_id, "school_id": school_id, "max_seconds": max_seconds},\n            headers={"Authorization": f"Bearer {token}"} if token else {},\n            timeout=10,\n        )\n        response.raise_for_status()\n    except Exception:\n        logger.exception("Could not dispatch solver job %s to worker", job_id)\n        db = SessionLocal()\n        try:\n            job = db.query(m.TtSolverJob).filter(m.TtSolverJob.id == job_id).first()\n            if job: _fail(db, job, "The timetable optimisation worker could not be reached.")\n        finally:\n            db.close()\n\ndef _ensure_calendar(db: Session, school_id: int):\n    if db.query(m.TtDay).filter(m.TtDay.school_id == school_id).count() == 0:\n        db.add_all([m.TtDay(school_id=school_id,index=i,name=n,is_active=True) for i,n in enumerate(DEFAULT_DAYS)])\n    if db.query(m.TtPeriod).filter(m.TtPeriod.school_id == school_id).count() == 0:\n        db.add_all([m.TtPeriod(school_id=school_id,index=i,name=n,start_time=s,end_time=e,is_teaching=t) for i,n,s,e,t in DEFAULT_PERIODS])\n    db.commit()\n\ndef _set_checks(checks, keys, state): return [{**c,"state":state} if c["key"] in keys else c for c in checks]\n\ndef _run_job(job_id, school_id, max_seconds):\n    db = SessionLocal()\n    try:\n        job = db.query(m.TtSolverJob).filter(m.TtSolverJob.id == job_id).first()\n        if not job: return\n        job.status="running"; job.stage="Loading school data"; job.progress=4; job.started_at=datetime.utcnow(); db.commit()\n        if not ORTOOLS_AVAILABLE: return _fail(db, job, "The scheduling engine is not available on this server.")\n        _ensure_calendar(db, school_id); data=build_input(db, school_id, max_seconds=max_seconds)\n        problems=preflight(data)\n        if problems: return _fail(db, job, " ".join(problems))\n        def cancelled():\n            db.expire_all(); row=db.query(m.TtSolverJob).filter(m.TtSolverJob.id==job_id).first(); return bool(row and row.cancel_requested)\n        def report(pct, stage):\n            row=db.query(m.TtSolverJob).filter(m.TtSolverJob.id==job_id).first()\n            if not row: return\n            row.progress=max(row.progress or 0,min(99,pct)); row.stage=stage; checks=row.checks or initial_checks()\n            if pct>=26: checks=_set_checks(checks,["teacher_conflicts","class_conflicts","room_conflicts","availability"],"passed"); row.status="running"\n            if pct>=40: row.status="optimizing"\n            if pct>=60: checks=_set_checks(checks,["workload","distribution"],"passed")\n            if pct>=84: row.status="validating"\n            row.checks=checks; db.commit()\n        result=solve(data,on_progress=report,should_cancel=cancelled)\n        if result.status=="cancelled" or cancelled():\n            job=db.query(m.TtSolverJob).filter(m.TtSolverJob.id==job_id).first()\n            if job: job.status="cancelled"; job.stage="Cancelled"; job.finished_at=datetime.utcnow(); job.message="Generation was cancelled."; db.commit()\n            return\n        job=db.query(m.TtSolverJob).filter(m.TtSolverJob.id==job_id).first()\n        if not job: return\n        if not result.solved: return _fail(db,job," ".join(result.messages) or "No feasible timetable was found.")\n        version=_persist(db,school_id,result,job.created_by)\n        breakdown=result.quality.get("breakdown",{}); checks=job.checks or initial_checks(); checks=_set_checks(checks,["teacher_conflicts","class_conflicts","room_conflicts","availability"],"passed"); checks=_set_checks(checks,["workload","distribution"],"passed"); checks=_set_checks(checks,["preferences"],"passed" if breakdown.get("morning_preference",100)>=90 else "warning")\n        job.checks=checks; job.status="completed"; job.stage="Completed"; job.progress=100; job.result_version_id=version.id; job.quality=result.quality; job.finished_at=datetime.utcnow(); db.commit()\n        db.add(m.TtAuditEntry(school_id=school_id,actor=job.created_by,action="generate",entity="version",entity_id=version.id,summary=f"Generated timetable v{version.number} ({version.label or 'Generated'})")); db.commit()\n    except Exception:\n        logger.exception("Solver job %s failed",job_id)\n        try:\n            job=db.query(m.TtSolverJob).filter(m.TtSolverJob.id==job_id).first()\n            if job: _fail(db,job,"The scheduling engine hit an unexpected problem.")\n        except Exception: pass\n    finally: db.close()\n\ndef _fail(db,job,message):\n    job.status="failed"; job.stage="Failed"; job.message=message; job.finished_at=datetime.utcnow(); db.commit()\n\ndef _persist(db,school_id,result,actor):\n    last=db.query(m.TtVersion).filter(m.TtVersion.school_id==school_id).order_by(m.TtVersion.number.desc()).first()\n    active=db.query(m.TtDay).filter(m.TtDay.school_id==school_id,m.TtDay.is_active.is_(True)).order_by(m.TtDay.index).all()\n    version=m.TtVersion(school_id=school_id,number=(last.number+1) if last else 1,label="Generated",status="draft",quality=result.quality,stats=result.stats,created_by=actor,day_indexes=[d.index for d in active],day_names=[d.name for d in active])\n    db.add(version); db.flush()\n    for p in result.placements: db.add(m.TtLesson(school_id=school_id,version_id=version.id,requirement_id=p.requirement_id,class_id=p.class_id,subject_id=p.subject_id,teacher_id=p.teacher_id,room_id=p.room_id,day_index=p.day,period_index=p.period,duration=p.duration))\n    db.commit()\n    from .engine import assign_rooms_to_lessons\n    assign_rooms_to_lessons(db,school_id,version.id); db.refresh(version); return version\n''')

          worker = Path('app/modules/scheduling/worker.py')
          worker.write_text('''"""Standalone HTTP entrypoint for the timetable CP-SAT worker."""\nfrom __future__ import annotations\n\nimport os\n\nfrom fastapi import FastAPI, Header, HTTPException\nfrom pydantic import BaseModel\n\nfrom .jobs import _run_job\nfrom .solver import ORTOOLS_AVAILABLE\n\napp = FastAPI(title="Phikila Timetable Solver Worker")\n\nclass SolverJob(BaseModel):\n    job_id: int\n    school_id: int\n    max_seconds: float = 30.0\n\n@app.get("/health")\ndef health():\n    return {"ok": True, "solver_available": ORTOOLS_AVAILABLE}\n\n@app.post("/run", status_code=202)\ndef run(job: SolverJob, authorization: str | None = Header(default=None)):\n    expected = os.getenv("SOLVER_WORKER_TOKEN", "")\n    if expected and authorization != f"Bearer {expected}":\n        raise HTTPException(401, "Invalid worker token")\n    if not ORTOOLS_AVAILABLE:\n        raise HTTPException(503, "OR-Tools is not installed on the worker")\n    _run_job(job.job_id, job.school_id, job.max_seconds)\n    return {"accepted": True, "job_id": job.job_id}\n''')

          docker = Path('Dockerfile.solver-worker')
          docker.write_text('''FROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt requirements-solver.txt ./\nRUN pip install --no-cache-dir -r requirements.txt -r requirements-solver.txt\nCOPY . .\nENV PYTHONUNBUFFERED=1\nCMD ["uvicorn", "app.modules.scheduling.worker:app", "--host", "0.0.0.0", "--port", "8000"]\n''')

          router = Path('app/modules/scheduling/router.py')
          text = router.read_text()
          text = text.replace('from datetime import datetime\n', 'from datetime import datetime\nimport os\n', 1)
          text = text.replace('from .tenancy import Principal, require_role, resolve_principal\n', 'from .tenancy import Principal, require_role, resolve_principal\n\nSOLVER_WORKER_URL = os.getenv("SOLVER_WORKER_URL", "").rstrip("/")\nSOLVER_AVAILABLE = ORTOOLS_AVAILABLE or bool(SOLVER_WORKER_URL)\n', 1)
          text = text.replace('"solver_available": ORTOOLS_AVAILABLE,', '"solver_available": SOLVER_AVAILABLE,')
          text = text.replace('    if not ORTOOLS_AVAILABLE:\n', '    if not SOLVER_AVAILABLE:\n', 1)
          text = text.replace('"solver_available": ORTOOLS_AVAILABLE,', '"solver_available": SOLVER_AVAILABLE,')
          router.write_text(text)

          # Remove this one-shot patch workflow after it has done its job.
          Path('.github/workflows/agent-timetable-worker-patch.yml').unlink()
          Path('.agent-patch-trigger').unlink(missing_ok=True)
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/scheduling/solver.py app/modules/scheduling/jobs.py app/modules/scheduling/worker.py app/modules/scheduling/router.py Dockerfile.solver-worker .github/workflows/agent-timetable-worker-patch.yml .agent-patch-trigger
          git commit -m "feat: connect timetable API to dedicated solver worker"
          git push
